<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tic-Tac-Toe — Foltz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d1117; color: #dbe4ee;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .wrap { text-align: center; padding: 16px; }
  header { font-size: 26px; font-weight: 800; letter-spacing: 4px; color: #f0f6fc; }
  header span { color: #39d353; font-size: 14px; letter-spacing: 2px; margin-left: 8px; }
  .scores {
    display: flex; gap: 28px; justify-content: center;
    margin: 14px 0; font-size: 12px; color: #7d8590; letter-spacing: 1px;
  }
  .scores b { display: block; font-size: 24px; margin-top: 4px; }
  #sx b { color: #39d353; }
  #st b, #so b { color: #f0f6fc; }
  .turn { text-shadow: 0 0 12px currentColor; }
  #board {
    display: grid; grid-template-columns: repeat(3, 110px); grid-template-rows: repeat(3, 110px);
    gap: 8px; justify-content: center;
  }
  .cell {
    background: #010409; border: 1px solid #21262d; border-radius: 12px;
    font-size: 56px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.12s, box-shadow 0.12s;
    touch-action: manipulation;
  }
  .cell:not(.taken):hover { border-color: #39d353; box-shadow: 0 0 18px rgba(57, 211, 83, 0.25); }
  .cell.x { color: #39d353; text-shadow: 0 0 16px rgba(57, 211, 83, 0.7); }
  .cell.o { color: #f0f6fc; text-shadow: 0 0 16px rgba(240, 246, 252, 0.5); }
  .cell.win { border-color: #39d353; box-shadow: 0 0 22px rgba(57, 211, 83, 0.55); animation: blink 0.45s steps(2) 3; }
  @keyframes blink { 50% { background: rgba(57, 211, 83, 0.18); } }
  #msg { margin-top: 14px; min-height: 20px; font-size: 13px; letter-spacing: 2px; color: #39d353; }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  button {
    background: #161b22; color: #dbe4ee; border: 1px solid #21262d;
    font: inherit; font-size: 12px; letter-spacing: 1px;
    padding: 9px 18px; border-radius: 8px; cursor: pointer;
  }
  button.active { border-color: #39d353; color: #39d353; }
  footer { margin-top: 12px; font-size: 11px; color: #484f58; letter-spacing: 1px; }
  @media (max-width: 420px) {
    #board { grid-template-columns: repeat(3, 88px); grid-template-rows: repeat(3, 88px); }
    .cell { font-size: 44px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>TIC-TAC-TOE<span>//FOLTZ</span></header>
  <div class="scores">
    <div id="sx">X<b>0</b></div>
    <div id="st">TIES<b>0</b></div>
    <div id="so">O<b>0</b></div>
  </div>
  <div id="board"></div>
  <div id="msg">your move</div>
  <div class="row">
    <button id="m1" class="active">1P vs CPU</button>
    <button id="m2">2 PLAYERS</button>
    <button id="rs">RESTART</button>
    <button id="rz">RESET SCORE</button>
  </div>
  <footer>click a square or press 1-9 · r = restart</footer>
</div>
<script>
"use strict";
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const boardEl = document.getElementById("board");
const msgEl = document.getElementById("msg");
const m1Btn = document.getElementById("m1");
const m2Btn = document.getElementById("m2");
const cells = [];
let board, turn, over, mode, scores, muted, AC;
try { scores = JSON.parse(localStorage.getItem("fz_ttt_scores")) || { x: 0, ties: 0, o: 0 }; }
catch (e) { scores = { x: 0, ties: 0, o: 0 }; }
try { muted = localStorage.getItem("fz_ttt_mute") === "1"; } catch (e) { muted = false; }

function beep(freq, dur) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.08, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
function winner(b) {
  for (let w of WINS) {
    const [a, c, d] = w;
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { who: b[a], line: w };
  }
  return b.every(v => v) ? { who: "tie", line: null } : null;
}
function minimax(b, maximizing, depth) {
  const r = winner(b);
  if (r) {
    if (r.who === "tie") return 0;
    return r.who === "o" ? 10 - depth : depth - 10;
  }
  if (maximizing) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) if (!b[i]) {
      b[i] = "o";
      best = Math.max(best, minimax(b, false, depth + 1));
      b[i] = "";
    }
    return best;
  }
  let best = Infinity;
  for (let i = 0; i < 9; i++) if (!b[i]) {
    b[i] = "x";
    best = Math.min(best, minimax(b, true, depth + 1));
    b[i] = "";
  }
  return best;
}
function bestMove(b) {
  let bi = -1, bv = -Infinity;
  const order = [4, 0, 2, 6, 8, 1, 3, 5, 7];
  for (let i of order) if (!b[i]) {
    b[i] = "o";
    const v = minimax(b, false, 0);
    b[i] = "";
    if (v > bv) { bv = v; bi = i; }
  }
  return bi;
}
function render() {
  document.querySelector("#sx b").textContent = scores.x;
  document.querySelector("#st b").textContent = scores.ties;
  document.querySelector("#so b").textContent = scores.o;
  document.querySelectorAll("#board .cell").forEach((el, i) => {
    el.textContent = board[i];
    el.className = "cell" + (board[i] ? " taken " + board[i].toLowerCase() : "");
  });
  document.querySelector("#sx").classList.toggle("turn", !over && turn === "x");
  document.querySelector("#so").classList.toggle("turn", !over && turn === "o");
}
function saveScores() {
  try { localStorage.setItem("fz_ttt_scores", JSON.stringify(scores)); } catch (e) {}
}
function finish(w) {
  over = true;
  if (w.line) w.line.forEach(i => cells[i].classList.add("win"));
  if (w.who === "tie") {
    scores.ties++; msgEl.textContent = "tie game";
    beep(300, 0.2);
  } else {
    scores[w.who]++; msgEl.textContent = w.who + " wins";
    beep(w.who === "x" ? 700 : 420, 0.25);
  }
  saveScores(); render();
}
function play(i) {
  if (over || board[i]) return;
  board[i] = turn;
  beep(turn === "x" ? 520 : 440, 0.08);
  const w = winner(board);
  render();
  if (w) return finish(w);
  turn = turn === "x" ? "o" : "x";
  render();
  msgEl.textContent = mode === 1 && turn === "o" ? "cpu thinking…" : (turn === "x" ? "x to move" : "o to move");
  if (mode === 1 && turn === "o" && !over) {
    setTimeout(() => {
      if (over) return;
      const m = bestMove(board.slice());
      if (m >= 0) play(m);
    }, 380);
  }
}
function newRound(starter) {
  board = ["","","","","","","","",""];
  turn = starter || "x"; over = false;
  msgEl.textContent = turn === "x" ? "x to move" : "o to move";
  render();
  if (mode === 1 && turn === "o") {
    setTimeout(() => { if (!over) { const m = bestMove(board.slice()); if (m >= 0) play(m); } }, 380);
  }
}
for (let i = 0; i < 9; i++) {
  const el = document.createElement("div");
  el.className = "cell";
  el.addEventListener("click", () => play(i));
  boardEl.appendChild(el);
  cells.push(el);
}
m1Btn.addEventListener("click", () => {
  mode = 1;
  m1Btn.classList.add("active"); m2Btn.classList.remove("active");
  newRound("x");
});
m2Btn.addEventListener("click", () => {
  mode = 2;
  m2Btn.classList.add("active"); m1Btn.classList.remove("active");
  newRound("x");
});
document.getElementById("rs").addEventListener("click", () => newRound("x"));
document.getElementById("rz").addEventListener("click", () => {
  scores = { x: 0, ties: 0, o: 0 };
  saveScores(); render();
  msgEl.textContent = "scoreboard cleared";
});
document.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "9") play(+e.key - 1);
  else if (e.key === "r" || e.key === "R") newRound("x");
  else if (e.key === "m" || e.key === "M") {
    muted = !muted;
    try { localStorage.setItem("fz_ttt_mute", muted ? "1" : "0"); } catch (e2) {}
  }
});
mode = 1;
newRound("x");
render();
</script>
</body>
</html>
